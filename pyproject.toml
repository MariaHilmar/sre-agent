[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-agent"
version = "0.1.0"
description = "Agente de SRE/AIOps para monitoramento de saúde contínuo de stacks Railway + Vercel + Supabase."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MariaHilmar" }]
keywords = ["sre", "aiops", "monitoring", "healthcheck", "railway", "vercel", "supabase", "devops"]
dependencies = [
  "httpx>=0.28.1",
  "pyyaml>=6.0",
  "rich>=15.0.0",
  "click>=8.4.2",
]

[project.optional-dependencies]
rca = ["anthropic>=0.120.0"]  # necessário só para o comando `diagnose` (RCA por LLM)
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MariaHilmar/sre-agent"

[project.scripts]
sre-agent = "sre_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
